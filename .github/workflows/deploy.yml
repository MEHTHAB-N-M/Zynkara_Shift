name: Deploy ZynkaraShift to Azure VM

# Triggers: push to main, or manual dispatch
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ===========================================================================
  # Job 1: Build & test the React frontend, upload as artifact
  # ===========================================================================
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || '' }}

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 3

  # ===========================================================================
  # Job 2: Deploy to Azure VM via SSH
  # ===========================================================================
  deploy-to-azure:
    name: Deploy to Azure VM
    runs-on: ubuntu-latest
    needs: build-frontend
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Deploy to Azure VM via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e
            echo "=== Deploying ZynkaraShift ==="

            # Navigate to project directory
            cd ~/Vaporup || cd ~/zynkarashift || { echo "Project directory not found"; exit 1; }

            # Pull latest code
            echo "Pulling latest code..."
            git pull origin main

            # Build frontend on the VM (in case artifact transfer is complex)
            echo "Building frontend..."
            cd frontend
            npm ci --prefer-offline --no-audit --no-fund 2>/dev/null || npm install
            npm run build
            cd ..

            # Restart containers
            echo "Restarting Docker Compose services..."
            docker compose pull
            docker compose up -d --build

            # Wait for health
            echo "Waiting for services to be healthy..."
            sleep 10
            docker compose ps

            echo "=== Deployment complete ==="

  # ===========================================================================
  # Job 3: Deploy frontend to GitHub Pages (backup/demo)
  # ===========================================================================
  deploy-github-pages:
    name: Deploy Frontend to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-frontend
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Setup Pages configuration
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'frontend/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
