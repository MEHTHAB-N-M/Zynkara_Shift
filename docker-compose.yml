version: '3.8'

services:
  postgres-control:
    image: postgres:15-alpine
    container_name: zynkara-postgres-control
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432" # Bind to localhost only (prevents public internet port scanning)
    volumes:
      - postgres_control_data:/var/lib/postgresql/data
    networks:
      - zynkara-traefik-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  control-plane-api:
    image: node:18-alpine
    container_name: zynkara-control-plane-api
    restart: unless-stopped
    working_dir: /app
    command: >
      sh -c "npm install && npm start"
    volumes:
      - ./backend:/app
      - ./frontend:/frontend
      - /var/run/docker.sock:/var/run/docker.sock
      # Map temporary volume base so orchestration engine can map user db volumes
      - zynkara_dynamic_volumes:/var/zynkara/volumes
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-control:5432/${POSTGRES_DB}
      - DOCKER_HOST=unix:///var/run/docker.sock
      - TRAEFIK_NETWORK=zynkara-traefik-net
      # Local path mapping on host for user volumes, can be configured
      - VOLUMES_BASE_PATH=/var/zynkara/volumes
      - PLATFORM_DOMAIN=${PLATFORM_DOMAIN:-zynkarashift.duckdns.org}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
    ports:
      - "8000:8000" # Expose direct access on port 8000
    depends_on:
      postgres-control:
        condition: service_healthy
    networks:
      - zynkara-traefik-net
    labels:
      - "traefik.enable=true"
      # Route zynkara.localhost or wildcard/main domain or raw IP to this API (serving dashboard)
      - "traefik.http.routers.control-plane.rule=Host(`zynkara.localhost`) || Host(`172.198.75.211`) || Host(`${PLATFORM_DOMAIN:-zynkarashift.duckdns.org}`) || Host(`zynkara.${PLATFORM_DOMAIN:-zynkarashift.duckdns.org}`)"
      - "traefik.http.routers.control-plane.entrypoints=web,websecure"
      - "traefik.http.services.control-plane.loadbalancer.server.port=8000"

  traefik:
    image: traefik:v2.11
    container_name: zynkara-traefik
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    ports:
      - "80:80"       # Public HTTP
      - "443:443"     # Public HTTPS
      - "127.0.0.1:8080:8080" # Traefik dashboard bound strictly to localhost
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - zynkara-traefik-net


networks:
  zynkara-traefik-net:
    name: zynkara-traefik-net
    driver: bridge

volumes:
  postgres_control_data:
  zynkara_dynamic_volumes:
